name: uikit
description: "Библиотека UIKIT для основных компонентов проекта."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  vize: ^1.0.4
  modal_bottom_sheet: ^3.0.0
  flutter_svg: ^2.3.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
   fonts:
     - family: Manrope
       fonts:
         - asset: lib/fonts/Manrope-Bold.ttf
           weight: 700
         - asset: lib/fonts/Manrope-SemiBold.ttf
           weight: 600
         - asset: lib/fonts/Manrope-Medium.ttf
           weight: 500
         - asset: lib/fonts/Manrope-Regular.ttf
           weight: 400

